name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47)+[char[]](58..64)+[char[]](91..96)+[char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object {Get-Random})

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires

          Add-LocalGroupMember -Group Administrators -Member RDP
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member RDP

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $url="https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $msi="$env:TEMP\tailscale.msi"

          Invoke-WebRequest $url -OutFile $msi

          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait

          Remove-Item $msi -Force

      - name: Connect Tailscale (Exit Node)
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-${{ github.run_id }} `
            --advertise-exit-node

          $retry=0
          do{
            Start-Sleep 5
            $ip=& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            $retry++
          }until($ip -or $retry -ge 20)

          if(!$ip){
            throw "No Tailscale IP assigned."
          }

          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $ip"

          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

      - name: Verify RDP
        shell: powershell
        run: |
          $result = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

          if(!$result.TcpTestSucceeded){
            throw "RDP is not reachable."
          }

          Write-Host "RDP is reachable."

      - name: Show Connection Info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : RDP"
          Write-Host "$env:RDP_CREDS"
          Write-Host "=========================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          while($true){
            Write-Host "$(Get-Date) Runner Active"
            Start-Sleep 300
          }
